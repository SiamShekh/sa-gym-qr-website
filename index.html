<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SA Gym - Transform Your Body</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <!-- Video Section -->
        <section class="video-section">
            <div class="video-wrapper" id="videoWrapper">
                <div class="loading-stripe" id="loadingStripe"></div>
                <div class="loading-spinner" id="loadingSpinner">
                    <div class="spinner-ring"></div>
                </div>
                <video 
                    id="gymVideo"
                    playsinline
                    preload="auto"
                    loop
                    disablePictureInPicture
                    controlsList="nodownload nofullscreen noremoteplayback"
                >
                    আপনার ব্রাউজার ভিডিও প্লে করতে সক্ষম নয়।
                </video>
                <div class="video-overlay" id="videoOverlay">
                    <div class="controls-bar">
                        <button class="control-btn restart-btn" id="restartBtn" aria-label="Restart video">
                            <svg viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                            </svg>
                        </button>
                        <button class="control-btn play-pause-btn" id="playPauseBtn" aria-label="Play video">
                            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="scroll-hint" id="scrollHint">
                        <svg class="scroll-arrow" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </section>

        <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
        <script>
            (function () {
                const video = document.getElementById('gymVideo');
                const overlay = document.getElementById('videoOverlay');
                const btn = document.getElementById('playPauseBtn');
                const restartBtn = document.getElementById('restartBtn');
                const wrapper = document.getElementById('videoWrapper');
                const loadingStripe = document.getElementById('loadingStripe');
                const loadingSpinner = document.getElementById('loadingSpinner');
                const scrollHint = document.getElementById('scrollHint');
                const hlsUrl = 'assets/hls/playlist.m3u8';
                let loadingTimeout;

                function showLoading() {
                    clearTimeout(loadingTimeout);
                    loadingStripe.classList.add('is-loading');
                    loadingSpinner.classList.add('is-loading');
                }

                function hideLoading() {
                    loadingStripe.classList.remove('is-loading');
                    loadingSpinner.classList.remove('is-loading');
                }

                function attemptAutoplay() {
                    video.muted = false;
                    showLoading();
                    const promise = video.play();
                    if (promise !== undefined) {
                        promise.catch(function () {
                            hideLoading();
                        }).finally(function () {
                            updateButton();
                            if (!video.paused) hideLoading();
                        });
                    }
                    updateButton();
                }

                function togglePlay(e) {
                    if (e) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                    if (video.paused || video.ended) {
                        showLoading();
                        video.play().catch(() => {});
                    } else {
                        video.pause();
                    }
                }

                function restartVideo(e) {
                    if (e) {
                        e.preventDefault();
                        e.stopPropagation();
                    }
                    showLoading();
                    video.currentTime = 0;
                    video.play().catch(() => {});
                }

                function handleEnded() {
                    video.currentTime = 0;
                    video.play().catch(() => {});
                }

                function updateButton() {
                    wrapper.classList.toggle('is-playing', !video.paused);
                }

                // Load HLS stream
                showLoading();
                if (Hls.isSupported()) {
                    const hls = new Hls({
                        maxBufferLength: 10,
                        maxMaxBufferLength: 20,
                        startLevel: -1,
                        abrEwmaDefaultEstimate: 1000000,
                        capLevelToPlayerSize: true,
                        debug: false
                    });
                    hls.loadSource(hlsUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, attemptAutoplay);
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = hlsUrl;
                    video.addEventListener('loadedmetadata', attemptAutoplay, { once: true });
                } else {
                    video.src = 'assets/video-compressed.mp4';
                    video.addEventListener('loadedmetadata', attemptAutoplay, { once: true });
                }

                // Instant input handling for mobile + desktop
                function bindFastClick(element, handler) {
                    function onStart(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        handler(e);
                    }
                    if (window.PointerEvent) {
                        element.addEventListener('pointerdown', onStart);
                    } else {
                        element.addEventListener('touchstart', onStart, { passive: false });
                    }
                    element.addEventListener('click', function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                    });
                }

                bindFastClick(btn, togglePlay);
                bindFastClick(restartBtn, restartVideo);

                // Loading indicator events
                video.addEventListener('loadstart', showLoading);
                video.addEventListener('waiting', showLoading);
                video.addEventListener('seeking', showLoading);
                video.addEventListener('playing', hideLoading);
                video.addEventListener('canplaythrough', hideLoading);
                video.addEventListener('seeked', hideLoading);
                video.addEventListener('pause', function () {
                    hideLoading();
                    updateButton();
                });
                video.addEventListener('stalled', function () {
                    loadingTimeout = setTimeout(showLoading, 200);
                });

                // Disable right-click context menu on video area
                overlay.addEventListener('contextmenu', function (e) {
                    e.preventDefault();
                    return false;
                });

                // Block common video shortcut keys
                overlay.addEventListener('keydown', function (e) {
                    if ([' ', 'ArrowRight', 'ArrowLeft', 'KeyF', 'KeyM'].includes(e.code)) {
                        e.preventDefault();
                    }
                });

                video.addEventListener('play', updateButton);
                video.addEventListener('ended', function () {
                    updateButton();
                    handleEnded();
                });

                // Scroll hint: shake player on load and hide hint on first scroll
                function triggerScrollHint() {
                    wrapper.classList.add('shake-hint');
                    setTimeout(function () {
                        wrapper.classList.remove('shake-hint');
                    }, 1200);
                }

                function hideScrollHint() {
                    scrollHint.classList.add('is-hidden');
                    window.removeEventListener('scroll', hideScrollHint);
                }

                window.addEventListener('DOMContentLoaded', triggerScrollHint);
                window.addEventListener('scroll', hideScrollHint, { passive: true });

                // Disable native controls entirely
                video.controls = false;
                video.muted = false;

                updateButton();
            })();
        </script>

        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <span class="tagline">Welcome to</span>
                <img class="hero-logo" src="assets/logo.png" alt="S.A GYM" width="260" height="auto">
                <p class="hero-subtitle">
                    আপনার ফিটনেস যাত্রা শুরু করুন আজ থেকেই। আধুনিক ইকুইপমেন্ট, অভিজ্ঞ ট্রেইনার এবং চমৎকার পরিবেশে গড়ে তুলুন স্বাস্থ্যকর জীবন।
                </p>
                <div class="hero-features">
                    <div class="feature">
                        <span class="feature-icon">💪</span>
                        <span class="feature-text">Modern Equipment</span>
                    </div>
                    <div class="feature">
                        <span class="feature-icon">🏋️</span>
                        <span class="feature-text">Expert Trainers</span>
                    </div>
                    <div class="feature">
                        <span class="feature-icon">⏰</span>
                        <span class="feature-text">Flexible Timing</span>
                    </div>
                </div>
                <div class="hero-actions">
                    <a href="tel:+8801746-933966" class="btn btn-primary">Call Now</a>
                    <a href="https://maps.app.goo.gl/z9HwEwsP9NpBUABy8?g_st=ac" target="_blank" class="btn btn-secondary">Get Location</a>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 SA Gym. All rights reserved.</p>
        </footer>
    </main>
</body>
</html>
